<!doctype html>
<meta charset="utf-8">
<textarea id="target" style="display:block;width:200px;height:200px"></textarea>
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
const target = document.getElementById("target");
const records = Object.create(null);
let phase = "none";
let overrideDropEffect = null;
let expectedDrops = 0;

function phaseRecord() {
  if (!records[phase]) {
    records[phase] = { enter: [], over: [], drop: [], input: [] };
  }
  return records[phase];
}

function modifierState(event) {
  return [event.altKey, event.ctrlKey, event.metaKey, event.shiftKey].join(",");
}

function resetTargetValue() {
  target.value = "hello world";
  target.focus();
  target.setSelectionRange(6, 11);
}

window.__setupDragOperationMaskPhase = function (nextPhase, dropEffect) {
  phase = nextPhase;
  overrideDropEffect = dropEffect || null;
  resetTargetValue();
};

resetTargetValue();

const complete = new Promise(function (resolve) {
  target.addEventListener("dragenter", function (event) {
    phaseRecord().enter.push([
      event.dataTransfer.dropEffect,
      event.dataTransfer.effectAllowed,
      modifierState(event),
      event.dataTransfer.getData("text"),
    ]);
  });

  target.addEventListener("dragover", function (event) {
    // This fixture negotiates author-handled operations. Uncanceled editor
    // drops instead use the editor's default copy operation.
    event.preventDefault();
    if (overrideDropEffect !== null) {
      event.dataTransfer.dropEffect = overrideDropEffect;
    }
    event.dataTransfer.setData("text", "must-not-replace-the-payload");
    phaseRecord().over.push([
      event.dataTransfer.dropEffect,
      event.dataTransfer.effectAllowed,
      modifierState(event),
      event.dataTransfer.getData("text"),
    ]);
  });

  target.addEventListener("drop", function (event) {
    phaseRecord().drop.push([
      event.dataTransfer.getData("text"),
      event.dataTransfer.dropEffect,
      event.dataTransfer.effectAllowed,
      target.value,
      modifierState(event),
    ]);
    expectedDrops += 1;
    if (phase === "modifierPrecedence") {
      // The default input action runs after the drop listener returns.
      setTimeout(resolve, 0);
    }
  });

  target.addEventListener("input", function () {
    phaseRecord().input.push([
      target.value,
      target.selectionStart,
      target.selectionEnd,
    ]);
  });
});

promise_test(async function () {
  await complete;
  const noKeys = "false,false,false,false";
  const expected = [
    { phase: "none", allowed: "none", over: ["none", "none"] },
    { phase: "link", allowed: "link", over: ["none", "none"], text: "link-text" },
    { phase: "move", allowed: "move", over: ["none", "none"], text: "move-text" },
    { phase: "copyLink", allowed: "copyLink", over: ["move", "move"] },
    { phase: "linkMove", allowed: "linkMove", over: ["copy", "copy"] },
    { phase: "all", allowed: "all", over: ["link", "link"], text: "all-text" },
    {
      phase: "modifiers", allowed: "copy", over: ["none", "none"], text: "modifiers-text",
      keys: ["true,true,true,true", "false,true,false,true", "true,false,true,false"],
    },
    {
      phase: "modifierSelection", allowed: "all", over: ["none", "none"], text: "auto-text",
      keys: ["false,true,false,false", "false,false,false,true", "true,false,false,false"],
    },
    {
      phase: "modifierPrecedence", allowed: "all", over: ["none", "none"], text: "precedence-text",
      keys: ["false,false,true,false", "false,true,false,true", "true,false,true,false"],
    },
  ];
  assert_array_equals(Object.keys(records), expected.map(function (item) { return item.phase; }), "every requested operation phase ran");
  for (const item of expected) {
    const record = records[item.phase];
    const keys = item.keys || [noKeys, noKeys, noKeys];
    assert_equals(record.enter.length, 1, item.phase + ": one dragenter");
    assert_array_equals(record.enter[0], ["none", item.allowed, keys[0], ""], item.phase + ": event view starts with none and protected data");
    assert_equals(record.over.length, 2, item.phase + ": explicit over and drop each negotiate dragover");
    for (let index = 0; index < 2; index++) {
      assert_array_equals(record.over[index], [item.over[index], item.allowed, keys[index + 1], ""], item.phase + ": operation/modifiers/protected data at over " + index);
    }
    if (item.text) {
      assert_equals(record.drop.length, 1, item.phase + ": allowed operation dispatches drop");
      assert_array_equals(record.drop[0], [item.text, "none", item.allowed, "hello world", keys[2]], item.phase + ": the drop command payload is readable only during drop");
      const caret = 6 + item.text.length;
      assert_equals(record.input.length, 1, item.phase + ": one default edit");
      assert_array_equals(record.input[0], ["hello " + item.text, caret, caret], item.phase + ": accepted drop replaces the selection");
    } else {
      assert_equals(record.drop.length, 0, item.phase + ": forbidden operation must not dispatch drop");
      assert_equals(record.input.length, 0, item.phase + ": forbidden operation must not edit");
    }
  }
  assert_equals(expectedDrops, 6, "only the six accepted phases dispatch drop");
}, "Input.dispatchDragEvent validates operation masks, protected data and modifier-key negotiation");
</script>
